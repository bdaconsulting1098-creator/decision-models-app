// Extract all mental model names mentioned in AI response text
// Models are formatted as **Model Name（中文）** or **Model Name** in markdown
function extractMentionedModels(text, allModels) {
  if (!text || !allModels || allModels.length === 0) return [];
  
  const mentioned = [];
  const seen = new Set();
  
  // Strategy 1: Extract bold text that matches model names
  // Pattern: **Model Name（中文）** or **Model Name**
  const boldMatches = text.match(/\*\*([^*]+?)\*\*/g) || [];
  for (const bm of boldMatches) {
    let name = bm.replace(/\*+/g, '').trim();
    // Strip Chinese parenthetical: "Model Name（中文）" -> "Model Name"
    name = name.replace(/[（(][^）)]*[）)]$/, '').trim();
    if (name.length < 3 || name.length > 80) continue;
    
    // Match against model library (name or englishName)
    // Use exact match first, then fuzzy substring match
    let found = allModels.find(m => 
      m.name === name || 
      m.englishName === name ||
      m.name.toLowerCase() === name.toLowerCase() ||
      (m.englishName && m.englishName.toLowerCase() === name.toLowerCase())
    );
    // Fuzzy fallback: if bold text is a substring of model name or vice versa
    if (!found) {
      const nameLower = name.toLowerCase();
      found = allModels.find(m => {
        const mNameLower = m.name.toLowerCase();
        const mEngLower = m.englishName ? m.englishName.toLowerCase() : '';
        // Check if name contains model name or model name contains name
        return (mNameLower.includes(nameLower) || nameLower.includes(mNameLower) ||
                (mEngLower && (mEngLower.includes(nameLower) || nameLower.includes(mEngLower))));
      });
    }
    if (found && !seen.has(found.id)) {
      seen.add(found.id);
      mentioned.push(found);
    }
  }
  
  // Strategy 2: ALWAYS do fuzzy substring match to catch models not in bold format
  // e.g. "Status-quo bias", "Sunk-cost fallacy", "Loss aversion" etc.
  for (const m of allModels) {
    if (seen.has(m.id)) continue;
    const namesToCheck = [m.name, m.englishName].filter(Boolean);
    for (const n of namesToCheck) {
      if (n.length > 3 && text.toLowerCase().includes(n.toLowerCase())) {
        seen.add(m.id);
        mentioned.push(m);
        break;
      }
    }
  }
  
  console.log('[extractMentionedModels] Found', mentioned.length, 'models from', text.length, 'chars');
  return mentioned;
}

function renderMd(text) {
  if (!text) return '';
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h2>$1</h2>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^---$/gm,'<hr/>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/^(\d+)\.\s+(.+)$/gm,'<li>$2</li>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br/>');
}

// Speech-to-Text hook using Web Speech API
function useSpeechToText() {
  const [listening, setListening] = useState(false);
  const recognitionRef = useRef(null);

  const startListening = useCallback((onResult, lang) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Speech recognition not supported in this browser. Try Chrome.'); return; }
    // Abort any existing session before starting a new one
    if (recognitionRef.current) { recognitionRef.current.abort(); recognitionRef.current = null; }
    const recognition = new SR();
    let resultHandled = false;
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = lang || 'en-US';
    recognition.onresult = (e) => {
      // Guard: only handle the first result, ignore any duplicate firings
      if (resultHandled) return;
      if (e.results[0].isFinal) {
        resultHandled = true;
        const transcript = e.results[0][0].transcript.trim();
        onResult(transcript);
        setListening(false);
      }
    };
    recognition.onerror = (e) => { setListening(false); recognitionRef.current = null; };
    recognition.onend = () => { setListening(false); recognitionRef.current = null; };
    recognitionRef.current = recognition;
    recognition.start();
    setListening(true);
  }, []);

  const stopListening = useCallback(() => {
    if (recognitionRef.current) { recognitionRef.current.abort(); recognitionRef.current = null; }
    setListening(false);
  }, []);

  return { listening, startListening, stopListening };
}

// Text-to-Speech
function speak(text, lang) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  let clean = text.replace(/\*\*/g,'').replace(/#{1,3}\s/g,'').replace(/[-*]\s/g,'');
  // For Chinese, extract Chinese from mixed headings like "Cognitive Traps（认知陷阱）"
  if (lang === 'zh-CN') {
    clean = clean.replace(/^([A-Z][A-Za-z\s&]+)（([^）]+）)/gm, '$2');
    clean = clean.replace(/\(([A-Za-z\s&]+)\)/g, ''); // remove English parenthetical
  }
  const utt = new SpeechSynthesisUtterance(clean);
  utt.rate = 0.9;
  utt.pitch = 1.0;
  utt.lang = lang || 'en-US';
  window.speechSynthesis.speak(utt);
}

function stopSpeaking() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

            <h3 className="text-xs font-semibold text-gray-500 mb-2 sm:mb-3 uppercase tracking-wider">{t.recentChats}</h3>
            <div className="space-y-2">
              {conversations.slice().reverse().slice(0, 5).map(conv => (

                  onClick={() => setActiveConvId(conv.id)}

                  <span className="text-base sm:text-lg">💬</span>
                  <div className="flex-1 min-w-0">
                    <p className="text-xs sm:text-sm text-gray-300 truncate">{conv.messages[0]?.content}</p>
                    <p className="text-[0.6rem] sm:text-[0.65rem] text-gray-600 mt-0.5">
                      {conv.messages.length} {t.messages}

                  </div>
                  <button onClick={(e) => { e.stopPropagation(); setConversations(prev => prev.filter(c => c.id !== conv.id)); }}
                    className="text-gray-600 hover:text-red-400 text-xs p-1 min-w-[32px] min-h-[32px] flex items-center justify-center">✕</button>

              {/* Voice input */}
              <button
                onClick={() => listening ? stopListening() : startListening((t) => setInput(prev => prev ? prev + ' ' + t : t), SR_LANG)}

                <option value="zh-CN">🇨🇳 中文</option>

              {/* Model selection */}
              <button onClick={()=>handleSubmit()} disabled={loading||!input.trim()}
                className={`ml-auto px-5 py-2.5 rounded-xl font-medium text-sm transition-all min-h-[44px] ${

                    ? 'bg-gray-800 text-gray-500 cursor-not-allowed'

              </button>
            </div>
          </div>
          <div className="text-xs text-gray-600 mt-3 hidden sm:block">{t.ctrlEnter} · 🎤 {t.voiceInput}</div>

          <p className="text-xs text-gray-600 mb-2 sm:mb-3">{t.tryThese}</p>
          <div className="flex flex-wrap gap-1.5 sm:gap-2">
            {examples.map(ex => (
              <button key={ex} onClick={()=>setInput(ex)}

            ))}
          </div>
        </div>
      </div>
    );
  }

  // Active conversation view
  return (
    <div className="max-w-3xl mx-auto flex flex-col" style={{height: 'calc(100vh - 56px)'}}>
      {/* Header */}
      <div className="flex items-center justify-between mb-2 sm:mb-3 flex-shrink-0 px-1">
        <button onClick={startNewChat} className="text-xs sm:text-sm text-gray-500 hover:text-purple-300 transition-colors min-h-[36px] min-w-[36px] flex items-center">
          {t.newDecision}
        </button>
        <div className="flex items-center gap-1.5 sm:gap-2">
          <span className="text-[0.65rem] text-gray-600">{activeConv?.messages?.length || 0}</span>
          {/* Language toggle in active chat */}
          <select value={language} onChange={e => setLanguage(e.target.value)}
            className="glass text-gray-400 text-[0.65rem] rounded-lg px-1 sm:px-1.5 py-1 cursor-pointer focus:outline-none border-none min-h-[36px]">
            <option value="en-US">🇺🇸</option>
            <option value="zh-CN">🇨🇳</option>
          </select>
          

        </div>
      </div>

      {/* Chat messages */}
      <div className="flex-1 overflow-y-auto space-y-3 sm:space-y-4 mb-2 sm:mb-3 pr-0 sm:pr-1">
        {/* Matched models (show once) */}
        {activeConv?.matchedModels?.length > 0 && (
          <div className="fade-in">
            <h3 className="text-xs font-semibold text-purple-300 mb-1.5 sm:mb-2 uppercase tracking-wider">{t.matchedModels}</h3>
            <div className="flex flex-wrap gap-1.5 sm:gap-2">
              {activeConv.matchedModels.map(m => (
                <button key={m.id} onClick={()=>onModelClick(m)}
                  className="text-[0.65rem] sm:text-xs px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg glass text-gray-300 hover:text-white transition-colors card-hover min-h-[36px]">
                  {m.name} <span className="text-gray-600 hidden sm:inline">{m.modelId}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {activeConv?.messages?.map((msg, i) => (
          <div key={i} className={`fade-in flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
            <div className={`max-w-[92%] sm:max-w-[85%] rounded-2xl px-4 py-3 sm:px-5 sm:py-3.5 ${
              msg.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'
            }`}>
              {msg.role === 'assistant' ? (
                <div>
                  <div className="md text-xs sm:text-sm" dangerouslySetInnerHTML={{__html: renderMd(msg.content)}} />
                  {msg.model && (
                    <div className="text-[0.6rem] sm:text-[0.65rem] text-gray-500 mt-1.5 sm:mt-2">
                      {providerLabel(msg.provider)} · {msg.model}
                    </div>
                  )}
                  <div className="flex items-center gap-2 mt-2 sm:mt-3 pt-1.5 sm:pt-2 border-t border-white/5">
                    <button
                      onClick={() => { if (speakingId === i) { stopSpeaking(); setSpeakingId(null); } else { speak(msg.content, SR_LANG); setSpeakingId(i); } }}
                      className={`text-xs px-2 py-1 rounded-md transition-colors min-h-[36px] min-w-[36px] ${
                        speakingId === i ? 'bg-purple-500/20 text-purple-300' : 'text-gray-600 hover:text-purple-300'
                      }`}>
                      {speakingId === i ? t.stop : t.readAloud}
                    </button>
                  </div>
                </div>
              ) : (
                <p className="text-xs sm:text-sm text-gray-200">{msg.content}</p>
              )}
            </div>
          </div>
        ))}

        {loading && (
          <div className="fade-in flex justify-start">
            <div className="chat-bubble-ai rounded-2xl px-5 py-4">
              <p className="text-gray-400 text-sm"><span className="loading-dots">{t.thinking}</span></p>
            </div>
          </div>
        )}

        {error && (
          <div className="fade-in glass rounded-xl p-4 text-center border border-red-500/20">
            <p className="text-red-300 text-sm">❌ {error}</p>
          </div>
        )}

        <div ref={chatEndRef} />
      </div>

      {/* Follow-up input */}
      <div className="flex-shrink-0 glass-strong rounded-2xl p-3 sm:p-4">
        <div className="flex items-end gap-1.5 sm:gap-2">
          <textarea value={input} onChange={e=>setInput(e.target.value)}
            placeholder={t.followUp}
            className="flex-1 bg-transparent text-gray-100 text-sm placeholder-gray-600 resize-none min-h-[40px] max-h-[120px] focus:outline-none"
            rows={1}
            onKeyDown={e=>{
              if(e.key==='Enter'&&!e.shiftKey&&(e.metaKey||e.ctrlKey)) handleSubmit();
              if(e.key==='Enter'&&!e.shiftKey&&!e.metaKey&&!e.ctrlKey) { e.preventDefault(); handleSubmit(); }
            }} />
          {/* Voice input */}
          <button
            onClick={() => listening ? stopListening() : startListening((t) => setInput(prev => prev ? prev + ' ' + t : t), SR_LANG)}
            className={`p-2 rounded-xl transition-all flex-shrink-0 min-w-[40px] min-h-[40px] flex items-center justify-center ${
              listening ? 'bg-red-500/20 text-red-400 recording' : 'glass text-gray-500 hover:text-purple-300'
            }`}
            title={listening ? t.stop : t.voiceInput}>
            {listening ? '⏹' : '🎤'}
          </button>
          <button onClick={()=>handleSubmit()} disabled={loading||!input.trim()}
            className={`px-3 sm:px-4 py-2 rounded-xl font-medium text-sm transition-all flex-shrink-0 min-h-[40px] min-w-[40px] flex items-center justify-center ${
              loading||!input.trim()
                ? 'bg-gray-800 text-gray-500 cursor-not-allowed'
                : 'bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 text-white hover:shadow-lg hover:shadow-purple-500/20'
            }`}>
            {loading ? '...' : '→'}
          </button>
        </div>
        <div className="text-[0.6rem] sm:text-[0.65rem] text-gray-600 mt-1.5">{t.enterSend} · 🎤 {t.voiceInput}</div>
      </div>
    </div>
  );
}

function App() {
  const [models, setModels] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [tab, setTab] = useState('decide');
  const [selectedModel, setSelectedModel] = useState(null);
  const [language, setLanguage] = useState('en-US'); // Global language state
  const [installPrompt, setInstallPrompt] = useState(null); // PWA install event
  const [showInstallBanner, setShowInstallBanner] = useState(false);

  // Listen for PWA install prompt
  useEffect(() => {
    const handler = (e) => {
      e.preventDefault();
      setInstallPrompt(e);
      // Show banner if not previously dismissed
      try {
        const dismissed = localStorage.getItem('mm_install_dismissed');
        if (!dismissed) setShowInstallBanner(true);
      } catch { setShowInstallBanner(true); }
    };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const handleInstall = async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    setInstallPrompt(null);
    setShowInstallBanner(false);
  };

  const dismissInstall = () => {
    setShowInstallBanner(false);
    try { localStorage.setItem('mm_install_dismissed', '1'); } catch {}
  };

  // i18n for App-level UI
  const appT = {
    'en-US': {
      tabAdvisor: '💡 Advisor',
      tabLibrary: (n) => `📚 Library (${n})`,
      loading: 'Loading mental models...',
      retry: 'Retry',
      syncNotion: '🔄 Sync from Notion',
      syncing: 'Syncing...',
      useLocal: '✓ Using cached models',
      loadModels: 'Load Models'
    },
    'zh-CN': {
      tabAdvisor: '💡 决策顾问',
      tabLibrary: (n) => `📚 模型库 (${n})`,
      loading: '正在加载心智模型...',
      retry: '重试',
      syncNotion: '🔄 从 Notion 同步',
      syncing: '同步中...',
      useLocal: '✓ 使用本地缓存模型',
      loadModels: '加载模型'
    }
  }[language] || {
      tabAdvisor: '💡 Advisor',
      tabLibrary: (n) => `📚 Library (${n})`,
      loading: 'Loading mental models...',
      retry: 'Retry',
      syncNotion: '🔄 Sync from Notion',
      syncing: 'Syncing...',
      useLocal: '✓ Using cached models',
      loadModels: 'Load Models'
    };

  // Conversation state lifted to App level for tab-switch persistence
  const [conversations, setConversations] = useState(() => {
    try {
      const saved = localStorage.getItem('dm_conversations');
      return saved ? JSON.parse(saved) : [];
    } catch { return []; }
  });
  const [activeConvId, setActiveConvId] = useState(() => {
    try { return localStorage.getItem('dm_activeConvId') || null; } catch { return null; }
  });

  // Persist conversations to localStorage
  useEffect(() => {
    try { localStorage.setItem('dm_conversations', JSON.stringify(conversations)); } catch {}
  }, [conversations]);
  useEffect(() => {
    try { localStorage.setItem('dm_activeConvId', activeConvId || ''); } catch {}
  }, [activeConvId]);

  const [syncing, setSyncing] = useState(false);
  const [dataSource, setDataSource] = useState(''); // 'local' or 'notion'

  // Load models from localStorage cache or API
  const loadModels = async (forceSync = false) => {
    setLoading(true);
    setError(null);
    
    // Try localStorage first if not forcing sync
    if (!forceSync) {
      try {
        const cached = localStorage.getItem('dm_models');
        if (cached) {
          const data = JSON.parse(cached);
          if (data.models && data.models.length > 0) {
            setModels(data.models);
            setDataSource('local');
            setLoading(false);
            return;
          }
        }
      } catch (e) {
        console.error('Failed to load cached models:', e);
      }
    }
    
    // Fetch from API
    try {
      const url = forceSync ? '/api/models?sync=true' : '/api/models';
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.models && data.models.length > 0) {
        setModels(data.models);
        setDataSource(data.source || 'notion');
        // Cache to localStorage
        try {
          localStorage.setItem('dm_models', JSON.stringify({ models: data.models, updatedAt: data.updatedAt, source: data.source }));
        } catch (e) {
          console.error('Failed to cache models:', e);
        }
      }
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  // Sync from Notion
  const syncFromNotion = async () => {
    setSyncing(true);
    await loadModels(true);
    setSyncing(false);
  };

  useEffect(() => {
    loadModels(false);
  }, []);

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-center">
          <div className="text-5xl mb-4 animate-pulse">🧠</div>
          <p className="text-gray-500 loading-dots">{appT.loading}</p>
        </div>
      </div>
    );
  }

  if (error) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="glass-strong rounded-2xl p-8 text-center max-w-md">
          <div className="text-4xl mb-4">⚠️</div>
          <p className="text-red-300 mb-4 text-sm">{error}</p>
          <button onClick={()=>window.location.reload()}
            className="px-4 py-2 rounded-lg bg-purple-500/15 text-purple-300 hover:bg-purple-500/25 text-sm">{appT.retry}</button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen">
      {/* PWA Install Banner */}
      {showInstallBanner && (
        <div className="install-banner px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex-1 min-w-0">
            <p className="text-sm text-purple-200 font-medium">{language === 'zh-CN' ? '📲 安装到手机' : '📲 Install App'}</p>
            <p className="text-xs text-gray-400 truncate">{language === 'zh-CN' ? '离线可用，更快访问' : 'Works offline, faster access'}</p>
          </div>
          <div className="flex items-center gap-2 flex-shrink-0">
            <button onClick={dismissInstall} className="text-gray-500 text-xs px-2 py-1">{language === 'zh-CN' ? '以后' : 'Later'}</button>
            <button onClick={handleInstall} className="bg-gradient-to-r from-blue-500 to-purple-500 text-white text-xs px-4 py-2 rounded-lg font-medium">{language === 'zh-CN' ? '安装' : 'Install'}</button>
          </div>
        </div>
      )}
      <nav className="glass sticky top-0 z-40">
        <div className="max-w-6xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between">
          <div className="flex items-center gap-2 sm:gap-3">
            <span className="text-lg sm:text-xl">🧠</span>
            <h1 className="text-base sm:text-lg font-bold gradient-text">Mental Models</h1>
          </div>
          <div className="flex items-center gap-1.5 sm:gap-2">

            {['decide','library'].map(t=>(
              <button key={t} onClick={()=>setTab(t)}
                className={`px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition-all ${
                  tab===t
                    ? 'bg-gradient-to-r from-blue-500/15 to-purple-500/15 text-white border border-purple-500/25'
                    : 'text-gray-500 hover:text-gray-300'
                }`}>
                {t==='decide' ? appT.tabAdvisor : appT.tabLibrary(models.length)}
              </button>
            ))}
            {/* Global language toggle */}
            <select value={language} onChange={e => setLanguage(e.target.value)}
              className="glass text-gray-400 text-xs rounded-lg px-1.5 sm:px-2 py-1.5 cursor-pointer focus:outline-none border-none">
              <option value="en-US">🇺🇸</option>
              <option value="zh-CN">🇨🇳</option>
            </select>
          </div>
        </div>
      </nav>
      <main className="max-w-6xl mx-auto px-3 sm:px-4 py-3 sm:py-4">
        {tab==='decide' && <DecisionHelper models={models} onModelClick={setSelectedModel} conversations={conversations} setConversations={setConversations} activeConvId={activeConvId} setActiveConvId={setActiveConvId} language={language} setLanguage={setLanguage} />}
        {tab==='library' && <ModelLibrary models={models} onModelClick={setSelectedModel} language={language} />}
      </main>
      <ModelDetail model={selectedModel} onClose={()=>setSelectedModel(null)} language={language} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Service Worker Registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      console.log('SW registered:', reg.scope);
    }).catch(err => console.log('SW registration failed:', err));
  });
}
</script>
</body>
</html>
